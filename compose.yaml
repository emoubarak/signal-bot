# Signal bot + signal-cli-rest-api. The signal-cli port listens on the host's
# Tailscale address only (set SIGNAL_BIND in .env), for linking the account.
services:
  signal-rest:
    image: bbernhard/signal-cli-rest-api:latest
    container_name: signal-rest
    restart: unless-stopped
    environment:
      MODE: json-rpc
    ports:
      - "${SIGNAL_BIND:-127.0.0.1}:8086:8080"
    volumes:
      - signal-data:/home/.local/share/signal-cli

  bot:
    build: .
    container_name: signal-bot
    restart: unless-stopped
    stop_grace_period: 75s  # the bot finishes its answers in progress (60 s max)
    env_file: .env
    environment:
      SIGNAL_SERVICE: signal-rest:8080
      DATA_DIR: /app/data
      ADMIN_HOST: 0.0.0.0  # inside the container only: the host side is ADMIN_BIND below
    ports:
      # Admin page (only when ADMIN_TOKEN is set). Local to the host by default; ADMIN_BIND=<tailscale ip> to reach it from your devices.
      - "${ADMIN_BIND:-127.0.0.1}:8090:8090"
    volumes:
      - ./data:/app/data
    depends_on:
      - signal-rest

volumes:
  signal-data:
    external: true
