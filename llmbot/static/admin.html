<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex">
<title>Signal bot settings</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- the phone's status bar takes the page's background; the in-page theme switch rewrites both (syncThemeColor) -->
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
:root{color-scheme:light;
--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
--font-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;
--font-m:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
--r:18px;--r-s:10px;--ease:cubic-bezier(.23,1,.32,1);
--bg:#f5f5f7;--elev:#ffffff;--zone:rgba(118,118,128,.08);--side:rgba(242,242,247,.78);--bg2:rgba(118,118,128,.12);--card:#ffffff;--card2:#fafafc;
--fg:#1d1d1f;--mut:#6e6e73;--line:rgba(0,0,0,.07);--line2:rgba(0,0,0,.12);
--acc:#0071e3;--accfg:#ffffff;--accsoft:rgba(0,113,227,.10);--acc2:#0077ed;
--shadow:0 1px 2px rgba(0,0,0,.04),0 2px 12px rgba(0,0,0,.04);--shadow2:0 2px 6px rgba(0,0,0,.05),0 12px 32px rgba(0,0,0,.08);
--ok:#248a3d;--okb:rgba(52,199,89,.14);--warn:#c45f00;--warnb:rgba(255,149,0,.16);--bad:#d70015;--badb:rgba(255,59,48,.12);
--run:#0066cc;--runb:rgba(0,122,255,.12);--idle:#6e6e73;--idleb:rgba(118,118,128,.12)}
:root[data-theme="dark"]{color-scheme:dark;
--bg:#000000;--elev:#2c2c2e;--zone:rgba(118,118,128,.16);--side:rgba(28,28,30,.72);--bg2:rgba(118,118,128,.24);--card:#1c1c1e;--card2:#242426;
--fg:#f5f5f7;--mut:#98989d;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
--acc:#0a84ff;--accfg:#ffffff;--accsoft:rgba(10,132,255,.18);--acc2:#3395ff;
--shadow:0 0 0 .5px rgba(255,255,255,.06),0 2px 12px rgba(0,0,0,.4);--shadow2:0 0 0 .5px rgba(255,255,255,.08),0 16px 40px rgba(0,0,0,.6);
--ok:#30d158;--okb:rgba(48,209,88,.16);--warn:#ff9f0a;--warnb:rgba(255,159,10,.18);--bad:#ff453a;--badb:rgba(255,69,58,.18);
--run:#64d2ff;--runb:rgba(100,210,255,.15);--idle:#98989d;--idleb:rgba(118,118,128,.24)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
--bg:#000000;--elev:#2c2c2e;--zone:rgba(118,118,128,.16);--side:rgba(28,28,30,.72);--bg2:rgba(118,118,128,.24);--card:#1c1c1e;--card2:#242426;
--fg:#f5f5f7;--mut:#98989d;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
--acc:#0a84ff;--accfg:#ffffff;--accsoft:rgba(10,132,255,.18);--acc2:#3395ff;
--shadow:0 0 0 .5px rgba(255,255,255,.06),0 2px 12px rgba(0,0,0,.4);--shadow2:0 0 0 .5px rgba(255,255,255,.08),0 16px 40px rgba(0,0,0,.6);
--ok:#30d158;--okb:rgba(48,209,88,.16);--warn:#ff9f0a;--warnb:rgba(255,159,10,.18);--bad:#ff453a;--badb:rgba(255,69,58,.18);
--run:#64d2ff;--runb:rgba(100,210,255,.15);--idle:#98989d;--idleb:rgba(118,118,128,.24)}}

*{box-sizing:border-box}
html{scroll-padding-top:16px}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.47 var(--font);letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-d);margin:0}
h1{font-size:34px;line-height:1.12;font-weight:700;letter-spacing:-.028em}
h2{font-size:22px;font-weight:600;letter-spacing:-.024em}
h3{font-size:17px;font-weight:600;letter-spacing:-.02em}
p{margin:0}
code{font:12.5px var(--font-m);letter-spacing:0;background:var(--bg2);border-radius:6px;padding:1px 6px}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--mut)}
[hidden]{display:none!important}

.card{background:var(--card);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow)}
.pill{border-radius:99px;padding:3px 10px 3px 8px;font-size:12px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;letter-spacing:0}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.idle{background:var(--idleb);color:var(--idle)}.pill.run{background:var(--runb);color:var(--run)}
.pill.warn{background:var(--warnb);color:var(--warn)}.pill.ok{background:var(--okb);color:var(--ok)}.pill.bad{background:var(--badb);color:var(--bad)}
/* a pill that opens its tool: 32 px drawn, 44 px to the finger (the zone overflows into the gaps) */
.pill-btn{border:0;font-family:inherit;min-height:32px;padding:4px 12px 4px 10px;cursor:pointer;position:relative}
.pill-btn::after{content:"";position:absolute;inset:-6px -4px}
@media (hover:hover) and (pointer:fine){.pill-btn:hover{box-shadow:inset 0 0 0 1px currentColor}}
.tool.flash{animation:flash 1.6s ease}
@keyframes flash{0%,45%{background:var(--accsoft)}100%{background:transparent}}

.btn{border:0;background:var(--bg2);color:var(--fg);border-radius:var(--r-s);padding:8px 15px;font:inherit;font-size:14px;font-weight:600;letter-spacing:-.01em;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;
  transition:transform .16s var(--ease),background-color .2s ease,color .2s ease}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);color:var(--accfg)}
.btn.ghost{background:transparent;color:var(--mut)}
.btn.bad{background:var(--badb);color:var(--bad)}
.btn.sm{padding:5px 11px;font-size:13px}
.btn.icon-btn{width:44px;height:44px;padding:0;border-radius:50%}.btn.icon-btn .ic svg{width:21px;height:21px}
.btn[disabled]{opacity:.38;cursor:default;transform:none}
@media (hover:hover) and (pointer:fine){.btn:hover{background:color-mix(in srgb,var(--bg2) 100%,var(--fg) 7%)}.btn.pri:hover{background:var(--acc2)}
  .btn.ghost:hover{background:var(--bg2);color:var(--fg)}.btn.bad:hover{background:color-mix(in srgb,var(--badb) 100%,var(--bad) 12%)}}
:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 55%,transparent);outline-offset:2px}

input[type=text],input[type=password],input[type=number],input[type=url],input[type=tel],textarea,select{width:100%;border:1px solid transparent;background:var(--zone);color:var(--fg);border-radius:var(--r-s);
  padding:9px 12px;font:inherit;font-size:14px;letter-spacing:-.01em;transition:box-shadow .2s ease,background-color .2s ease}
textarea{resize:vertical;min-height:64px;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:0;background:var(--card);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 35%,transparent)}
input::placeholder,textarea::placeholder{color:var(--mut);opacity:.8}
.f{display:grid;gap:6px}
.f>label{font-size:13px;font-weight:600}
.help{font-size:13px;color:var(--mut)}
.meta{font-size:12px;color:var(--mut);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.meta .src{color:var(--acc);font-weight:600}
.meta button{all:unset;cursor:pointer;color:var(--acc);font-weight:600}
.meta button:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 55%,transparent);outline-offset:2px;border-radius:4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.seg{display:inline-flex;gap:2px;background:var(--bg2);padding:2px;border-radius:10px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--fg);padding:6px 16px;border-radius:8px;font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
:root[data-theme="dark"] .seg button.on{background:#636366}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button.on{background:#636366}}

/* interrupteur */
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{position:absolute;inset:0;opacity:.011;margin:0;cursor:pointer;width:100%;height:100%;z-index:1;-webkit-appearance:none;appearance:none;background:transparent;border:0}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--bg2);transition:background-color .2s ease}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .22s var(--ease)}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i::after{transform:translateX(18px)}
.sw input:focus-visible+i{outline:3px solid color-mix(in srgb,var(--acc) 55%,transparent);outline-offset:2px}
.sw input:disabled{cursor:default}.sw input:disabled+i{opacity:.45}

/* mise en page */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.side{position:sticky;top:0;height:100vh;height:100dvh;padding:22px 14px;display:flex;flex-direction:column;gap:6px;background:var(--side);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);box-shadow:inset -.5px 0 0 var(--line2)}
.side .brand{padding:4px 10px 16px;font-family:var(--font-d);font-size:17px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.side .brand b{width:30px;height:30px;border-radius:9px;background:var(--acc);color:var(--accfg);display:grid;place-items:center;font-size:16px}
.side nav{display:grid;gap:2px}
.side nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:8px 10px;min-height:36px;border-radius:8px;color:var(--fg);font-size:14px;font-weight:500;cursor:pointer;transition:background-color .15s ease}
.side nav button:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 55%,transparent);outline-offset:1px}
.side nav button.on{background:var(--bg2);font-weight:600}
@media (hover:hover) and (pointer:fine){.side nav button:hover{background:var(--zone)}}
.side nav .badge{margin-left:auto}
.ic{display:inline-grid;place-items:center;flex:none}.ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side nav button .ic{color:var(--acc)}
.side nav .lbl-s,.head-acts{display:none}
.side .foot{margin-top:auto;display:grid;gap:6px}
.install-slot:empty{display:none}
@media (display-mode:standalone){.install-slot{display:none}}
main{padding:34px 36px 140px;max-width:880px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.head p{color:var(--mut);margin-top:6px;max-width:56ch}
section.page{display:none;gap:16px;animation:in .22s var(--ease)}
section.page.on{display:grid}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card>h3{margin-bottom:4px}
.lead{font-size:13px;color:var(--mut);margin-top:2px}
.card.stack>div:first-child{margin-bottom:-2px}
.restart{color:var(--warn);font-weight:600}
.stack{display:grid;gap:18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.stat{display:grid;gap:2px}
.stat .k{font-size:12px;font-weight:600;color:var(--mut)}
.stat .v{font-family:var(--font-d);font-size:24px;font-weight:700;letter-spacing:-.024em;overflow-wrap:anywhere}
.stat .s{font-size:13px;color:var(--mut);overflow-wrap:anywhere}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.banner{border-radius:var(--r-s);padding:12px 16px;font-size:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.warn{background:var(--warnb);color:var(--warn)}.banner.bad{background:var(--badb);color:var(--bad)}.banner.ok{background:var(--okb);color:var(--ok)}
.banner b{font-weight:600}

/* liste d'outils */
.tools{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.tools h4{margin:0;padding:14px 20px 8px;font-size:12px;font-weight:600;color:var(--mut);background:var(--card2)}
.tool{padding:14px 20px;display:grid;gap:10px;box-shadow:0 -.5px 0 var(--line2)}
.tool .top{display:flex;gap:14px;align-items:center}
.tool .txt{flex:1;min-width:0}
.tool .name{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tool .name .pill{white-space:normal}
.tool .help{margin-top:1px}
.tool .try{display:grid;gap:8px;padding:12px;border-radius:var(--r-s);background:var(--zone)}
.tool pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:12.5px/1.45 var(--font-m);letter-spacing:0;max-height:240px;overflow:auto}
.tool img{max-width:100%;max-height:200px;border-radius:8px}
.tool .keybox{padding:12px;border-radius:var(--r-s);background:var(--zone);display:grid;gap:8px}

/* barre d'enregistrement */
.savebar{position:fixed;left:248px;right:0;bottom:0;padding:12px 36px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none;z-index:5}
.savebar .in{pointer-events:auto;max-width:880px;width:100%;display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--side);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  border-radius:14px;padding:10px 12px 10px 18px;box-shadow:var(--shadow2);transform:translateY(0);transition:transform .25s var(--ease),opacity .2s ease}
.savebar .in .txt{font-weight:600;font-size:14px}
.savebar .in .err{color:var(--bad);font-size:13px;font-weight:500}

.toast{position:fixed;right:20px;top:calc(20px + env(safe-area-inset-top));z-index:20;display:grid;gap:8px;pointer-events:none}
.toast div{background:var(--card);box-shadow:var(--shadow2);border-radius:12px;padding:11px 16px;font-size:14px;font-weight:500;max-width:360px;animation:in .22s var(--ease)}
.toast .ok{border-left:4px solid var(--ok)}.toast .bad{border-left:4px solid var(--bad)}

/* fenêtres : <dialog> natif (Échap et le geste retour d'Android la ferment, le focus revient au bouton) */
dialog.modal{border:0;padding:0;background:transparent;color:var(--fg);width:min(420px,calc(100% - 32px));max-width:none;max-height:none;overflow:visible}
dialog.modal::backdrop{background:rgba(0,0,0,.5);animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal .box{background:var(--elev);border-radius:var(--r);box-shadow:var(--shadow2);padding:24px;display:grid;gap:14px;animation:pop .22s var(--ease);
  max-height:calc(100dvh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom));overflow:auto;overscroll-behavior:contain}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.modal .box img{width:100%;max-width:300px;justify-self:center;border-radius:10px;background:#fff;padding:8px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* connexion */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom))}
.login .card{width:100%;max-width:380px;display:grid;gap:16px;padding:28px}
.login .help:empty{display:none}

@media (max-width:820px){
  /* téléphone : barre d'onglets en bas (à portée du pouce), contenu sous la barre d'état */
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:6;flex-direction:row;gap:0;
    padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-shadow:inset 0 .5px 0 var(--line2)}
  .side .brand,.side .foot{display:none}
  .side nav{display:flex;gap:0;flex:1}
  .side nav button{flex:1 1 auto;min-width:0;position:relative;flex-direction:column;justify-content:center;gap:3px;min-height:58px;padding:6px 2px 5px;border-radius:0;
    color:var(--mut);font-size:12px;font-weight:500;letter-spacing:-.01em;text-align:center;-webkit-tap-highlight-color:transparent}
  .side nav button .ic{color:inherit}
  .side nav button .ic svg{width:24px;height:24px}
  .side nav button.on{background:transparent;color:var(--acc);font-weight:600}
  .side nav .lbl{display:none}.side nav .lbl-s{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side nav .badge{position:absolute;top:7px;left:calc(50% + 9px);margin:0;width:10px;height:10px;padding:0;font-size:0;background:var(--warn);box-shadow:0 0 0 2px var(--bg)}
  .side nav .badge::before{display:none}
  main{padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(84px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
  .app.dirty main{padding-bottom:calc(170px + env(safe-area-inset-bottom))}
  /* titre et boutons sur une ligne, les phrases d'aide sur toute la largeur dessous */
  .head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 12px;align-items:center;margin-bottom:16px}
  .head>div:first-child{display:contents}
  .head>div:first-child>p{grid-column:1/-1}
  .head-acts{display:flex;gap:8px;align-items:center;grid-row:1;grid-column:2}
  h1{font-size:28px}
  .savebar{left:0;bottom:calc(58px + env(safe-area-inset-bottom));padding:8px max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left))}
  .savebar .in{padding:8px 8px 8px 14px;gap:10px}
  .savebar .in .txt{font-size:13px;line-height:1.3}
  .grid2{grid-template-columns:1fr}
  .cards3{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .cards3>.card:first-child{grid-column:1/-1}
  .card{padding:18px}
  .card.stat{padding:14px 16px}
  .stat .v{font-size:20px}
  .stat .pill{white-space:normal}
  .tool{padding:14px 16px}
  .tools h4{padding:12px 16px 6px}
  .tool .top{align-items:flex-start;gap:10px}
  .toast{left:12px;right:12px;justify-items:center}
  .toast div{max-width:100%}
  html{scroll-padding-bottom:calc(170px + env(safe-area-inset-bottom))}
}
/* écran tactile : zones de toucher de 44 px, texte des champs à 16 px (pas de zoom au focus) */
@media (pointer:coarse){
  .btn,.btn.sm{min-height:44px}
  .btn.sm{padding:8px 14px;font-size:14px}
  .seg button{min-height:42px}
  .meta{row-gap:10px}
  .meta button{padding:13px 4px;margin:-13px -4px}
  .sw input{top:-8px;left:-6px;width:calc(100% + 12px);height:calc(100% + 16px)}
  input:not([type=checkbox]),textarea,select{font-size:16px}
  input:not([type=checkbox]),select{min-height:44px}
  .row{gap:12px}
}
@media (max-width:820px) and (pointer:coarse){
  /* clavier ouvert : la barre d'onglets s'efface pour laisser la place au champ et à « Enregistrer » */
  .kb .side{display:none}
  .kb .savebar{bottom:0}
  .kb .app.dirty main,.kb main{padding-bottom:110px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (prefers-reduced-transparency:reduce){.side,.savebar .in{backdrop-filter:none;-webkit-backdrop-filter:none}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" aria-live="polite"></div>
<script>
"use strict";
// installable as an app (Brave/Chrome: "Install"); the worker caches nothing
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
// "Install app": shown only while the browser offers to install the page (HTTPS, not installed
// yet), in the page's own slots (sidebar, phone header, login card) so it never covers another button
let installPrompt = null;
async function install() {
  if (!installPrompt) return;
  const p = installPrompt;
  installPrompt = null;            // a prompt can be shown once; the browser offers a new one later if it wants
  fillInstallSlots();
  try { await p.prompt(); } catch (e) { /* already used */ }
}
function fillInstallSlots() {
  for (const slot of document.querySelectorAll(".install-slot")) {
    slot.replaceChildren();
    if (installPrompt) { const b = document.createElement("button"); b.className = "btn sm"; b.type = "button"; b.textContent = "Install app"; b.addEventListener("click", install); slot.append(b); }
  }
}
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installPrompt = e; fillInstallSlots(); });
window.addEventListener("appinstalled", () => { installPrompt = null; fillInstallSlots(); });
// phone keyboard open: a text field has the focus AND the page got shorter (the keyboard takes the
// bottom, interactive-widget=resizes-content). The bottom tab bar then steps aside (CSS .kb). Android's

    : t.reason && !S.tools.find(x => x.name === t.name).working ? h("span", { class: "pill warn" }, t.reason)
    : h("span", { class: "pill ok" }, "On");
  const sw = h("span", { class: "sw" }, h("input", { id: "t-" + t.name, type: "checkbox", role: "switch", checked: on, disabled: t.locked, "aria-label": t.label, onchange: e => { if (e.target.checked) D.tools.delete(t.name); else D.tools.add(t.name); render(); } }), h("i"));
  const tr = TRY[t.name];
  const open = tryState[t.name] && tryState[t.name].open;
  const parts = [h("div", { class: "top" }, h("div", { class: "txt" }, h("div", { class: "name" }, t.label, state), h("div", { class: "help" }, t.help)),
    (tr !== false && !t.locked) ? h("button", { class: "btn sm", type: "button", "aria-expanded": open ? "true" : "false", onclick: () => { tryState[t.name] = { ...(tryState[t.name] || {}), open: !open }; render(); if (!open) { const i = document.getElementById("try-" + t.name); if (i) i.focus(); } } }, open ? "Close" : "Try") : null, sw)];
  if (t.name === "send_gif") parts.push(h("div", { class: "keybox" }, secretField("klipy_api_key")));
  if (open) {
    const ts = tryState[t.name];
    const input = tr ? h("input", { id: "try-" + t.name, type: t.name === "read_page" ? "url" : "text", inputmode: t.name === "read_page" ? "url" : undefined, enterkeyhint: "go", autocomplete: "off", spellcheck: false,
      placeholder: tr[1], value: ts.text || "", "aria-label": tr[0], oninput: e => { ts.text = e.target.value; },
      onkeydown: e => { if (e.key === "Enter") runTry(t.name); } }) : null;
    parts.push(h("div", { class: "try" }, h("div", { class: "row" }, input ? h("div", { style: "flex:1;min-width:180px" }, input) : null,
      h("button", { class: "btn sm pri", type: "button", disabled: ts.busy, onclick: () => runTry(t.name) }, ts.busy ? "Running…" : "Run")),
      ts.result ? h("pre", null, ts.result.text) : null, ts.result && ts.result.gif ? h("img", { src: ts.result.gif, alt: "GIF found" }) : null));
  }
  return h("div", { class: "tool", id: "tool-" + t.name }, parts);
}
// from the overview: open the Tools page on that tool, briefly lit up
function openTool(name) {
  page = "tools"; saveError = ""; history.replaceState(null, "", "#tools"); render();
  const row = document.getElementById("tool-" + name);
  if (!row) return;
  row.scrollIntoView({ block: "center" });
  row.classList.add("flash");
  setTimeout(() => row.classList.remove("flash"), 1600);
  const target = row.querySelector(".btn:not([disabled]), input:not([disabled])");
  if (target) target.focus({ preventScroll: true });
  else { row.tabIndex = -1; row.focus({ preventScroll: true }); }
}
function pageTools() {
  const groups = {};
  for (const t of S.tools) (groups[t.group] = groups[t.group] || []).push(t);
  const out = [h("div", { class: "card" }, boolField("web_tools"))];
  for (const g of ["Internet", "Images", "Conversation", "Utilities"]) { const list = groups[g] || []; out.push(h("div", { class: "tools" }, h("h4", null, g.toUpperCase()), list.map(toolRow))); }
  out.push(h("p", { class: "help" }, "A tool that is off is no longer offered to the bot, which no longer knows it exists. Trying a tool costs nothing."));
  return out;
}

function pageAccount() {
  const sg = signal;
  let status;
  if (!sg) status = h("span", { class: "pill idle" }, "Checking…");
  else if (!sg.reachable) status = h("span", { class: "pill bad" }, "signal-cli is not responding at " + sg.service);
  else if (sg.registered === false) status = h("span", { class: "pill warn" }, "This number is not linked to signal-cli");
  else if (!sg.registered) status = h("span", { class: "pill warn" }, "Could not read the account list: try again with \u201cCheck again\u201d");
  else status = h("span", { class: "pill ok" }, "Connected to Signal");
  return [
    h("div", { class: "card stack" }, h("div", null, h("h3", null, "Signal account"), h("p", { class: "lead" }, "The number the bot reads and writes with.")),
      h("div", { class: "row" }, status, h("span", { class: "help" }, "Service: " + S.status.signal_service)),
      textField("phone_number"),
      h("div", { class: "row" }, h("button", { class: "btn sm", type: "button", onclick: showQr }, "Link a device (QR code)"), h("button", { class: "btn sm ghost", type: "button", onclick: refreshSignal }, "Check again"))),
    h("div", { class: "card stack" }, h("div", null, h("h3", null, "Which groups it answers in, and to whom"), h("p", { class: "lead" }, "Leave empty to answer everywhere and to everyone.")),
      textField("allowed_groups"), textField("allowed_numbers")),
    h("div", { class: "card stack" }, h("div", null, h("h3", null, "Bot identity")),
      textField("bot_name"), textField("bot_aliases"), textField("owner_number"), textField("timezone")),
  ];
}

function pageBehavior() {
  return [
    h("div", { class: "card stack" }, h("div", null, h("h3", null, "Limits"), h("p", { class: "lead" }, "So the bot does not cost too much or flood the group.")),
      h("div", { class: "grid2" }, textField("rate_limit_per_hour"), textField("images_per_day"))),
    h("div", { class: "card stack" }, h("div", null, h("h3", null, "Memory and replies")),
      h("div", { class: "grid2" }, textField("context_messages"), textField("max_output_tokens")), boolField("describe_images")),
    h("div", { class: "card stack" }, h("div", null, h("h3", null, "Fixed messages"), h("p", { class: "lead" }, "What the bot posts by itself, not written by the model. Words in {braces} are filled in.")),
      ...Object.keys(S.fields).filter(k => k.startsWith("msg_")).map(k => textField(k))),
    h("div", { class: "card stack" }, h("div", null, h("h3", null, "Startup")),
      boolField("announce_startup"), textField("attachment_retention_days")),
    h("div", { class: "card stack" }, h("div", null, h("h3", null, "Maintenance"), h("p", { class: "lead" }, "A restart lets the bot finish the replies in progress. It comes back by itself when it runs in a container.")),
      h("div", { class: "row" }, h("button", { class: "btn", onclick: restart }, "Restart the bot"), h("button", { class: "btn ghost", onclick: logout }, "Sign out"))),
  ];
}

const PAGES = [  // id, title, line under it, page, label in the phone's tab bar
  ["overview", "Overview", "Where the bot stands, at a glance.", pageOverview, "Overview"],
  ["provider", "Provider", "Who writes the bot's replies, and with which key.", pageProvider, "Provider"],
  ["tools", "Tools", "What the bot is allowed to do.", pageTools, "Tools"],
  ["account", "Account and groups", "The Signal number, the bot's name and the groups it answers in.", pageAccount, "Account"],
  ["behavior", "Behaviour", "Limits, memory and maintenance.", pageBehavior, "Behaviour"],
];

/* ---------- actions ---------- */
async function testProvider() {
  const local = !!D.values.local_base_url;
  providerMsg = { ok: true, message: "Testing…" }; render();
  try {
    providerMsg = await api("POST", "/api/test/provider", { base_url: local ? D.values.local_base_url : "", api_key: D.secretNew.openrouter_api_key || "" });
    if (providerMsg.models && providerMsg.models.length) localModels = providerMsg.models;
  } catch (e) { providerMsg = { ok: false, message: e.message }; }
  render();
}
async function runTry(name) {
  const ts = tryState[name] = tryState[name] || {};
  ts.busy = true; ts.result = null; render();
  try { ts.result = await api("POST", "/api/test/tool", { tool: name, input: ts.text || (TRY[name] ? "" : "") }); }
  catch (e) { ts.result = { ok: false, text: e.message }; }
  ts.busy = false; render();
}
async function refreshSignal() { signal = null; render(); try { signal = await api("GET", "/api/signal"); } catch (e) { signal = { reachable: false, service: S.status.signal_service }; } render(); }
function showQr() {
  const close = h("button", { class: "btn pri", type: "button", onclick: () => d.close() }, "Close");
  const d = openDialog("Link a device", h("div", { class: "box" }, h("h3", null, "Link a device"),
    h("p", { class: "muted" }, "On the account's phone: open Signal, then Settings > Linked devices > Link new device, and scan this code. It gives access to the account: do not show it to anyone."),
    h("img", { src: "/api/signal/qr?" + Date.now(), alt: "Signal link QR code", onerror: e => { e.target.replaceWith(h("p", { class: "help", style: "color:var(--bad)" }, "The QR code is not available: signal-cli is not responding.")); } }),
    h("div", { class: "acts" }, close)));
  close.focus();
}
async function restart() {
  if (!await confirmBox("Restart the bot?", "It finishes the replies in progress, stops, then comes back by itself when it runs in a container. Allow about ten seconds.", "Restart", true)) return;
  try { await api("POST", "/api/restart"); } catch (e) { toast(e.message, "bad"); return; }
  toast("Restarting…");
  const t0 = Date.now();
  const poll = async () => {
    try { const r = await fetch("/healthz", { cache: "no-store" }); if (r.ok && Date.now() - t0 > 4000) { await load(); toast("The bot is back."); return; } } catch (e) { /* encore éteint */ }
    if (Date.now() - t0 > 120000) { toast("The bot is not responding yet. Check that it is restarting (docker compose ps).", "bad"); return; }
    setTimeout(poll, 1500);
  };
  setTimeout(poll, 2500);
}
async function logout() { try { await api("POST", "/api/logout"); } catch (e) { /* ignore */ } showLogin(); }
async function save() {
  const keys = changedKeys();
  if (!keys.length) return;
  saveError = ""; render();
  try {
    const r = await api("PUT", "/api/config", buildBody());
    S = r.state; resetDraft();
    const now = r.changed.filter(k => S.fields[k] && S.fields[k].live), later = r.changed.filter(k => S.fields[k] && !S.fields[k].live);
    toast(!later.length ? "Saved and applied." : !now.length ? "Saved. It will apply after the restart." : "Saved. " + plural(later.length, "setting is", "settings are") + " waiting for the restart.");
    (r.warnings || []).forEach(w => toast(w, "bad"));
    if (r.changed.includes("openrouter_api_key") || r.changed.includes("local_base_url")) { providerMsg = null; refreshModels(); }
    refreshSignal();
  } catch (e) { saveError = e.message; }
  render();
}
async function refreshModels() { try { models = await api("GET", "/api/models"); render(); } catch (e) { /* suggestions seulement */ } }

/* ---------- affichage ---------- */
function update() { // frappe : met à jour la barre d'enregistrement sans reconstruire les champs (garde le focus)
  const n = changedKeys().length;
  const bar = $("#savebar");
  if (!bar) return;
  bar.hidden = n === 0;
  $(".app").classList.toggle("dirty", n > 0);
  $("#savecount").textContent = unsaved(n);
}
function render() {
  const root = $("#root");
  const active = document.activeElement && document.activeElement.id;
  const pos = window.scrollY;
  const n = changedKeys().length;
  const nav = PAGES.map(([id, label, , , short]) => {
    const badge = id === "overview" && S.restart_pending.length ? h("span", { class: "pill warn badge" }, "Restart") : null;
    return h("button", { class: id === page ? "on" : "", "aria-label": badge ? label + ", restart needed" : label, "aria-current": id === page ? "page" : undefined, onclick: () => { page = id; saveError = ""; history.replaceState(null, "", "#" + id); render(); window.scrollTo(0, 0); if (id === "account") refreshSignal(); if (id === "provider") refreshModels(); } },
      icon(id), h("span", { class: "lbl" }, label), h("span", { class: "lbl-s" }, short), badge);
  });
  const themeBtn = (cls, text) => h("button", { class: cls, type: "button", onclick: toggleTheme, "aria-label": "Switch between light and dark theme" }, icon("theme"), text);
  const cur = PAGES.find(p => p[0] === page);
  const bar = h("div", { class: "savebar", id: "savebar", hidden: n === 0 }, h("div", { class: "in" },
    h("div", null, h("div", { class: "txt", id: "savecount" }, unsaved(n)), saveError ? h("div", { class: "err" }, saveError) : null),
    h("div", { class: "row", style: "flex-wrap:nowrap" }, h("button", { class: "btn", onclick: () => { resetDraft(); render(); } }, "Cancel"), h("button", { class: "btn pri", onclick: save }, "Save"))));
  root.replaceChildren(h("div", { class: "app" + (n ? " dirty" : "") },
    h("aside", { class: "side" }, h("div", { class: "brand" }, h("b", null, "✦"), "Signal bot settings"), h("nav", { "aria-label": "Sections" }, nav),
      h("div", { class: "foot" }, h("div", { class: "install-slot" }), themeBtn("btn sm ghost", "Light / dark"))),
    h("main", null, h("div", { class: "head" }, h("div", null, h("h1", null, cur[1]), h("p", null, cur[2]),
      page !== "overview" ? h("p", { class: "help", style: "margin-top:2px" }, "Unless noted otherwise, a change applies as soon as you save.") : null),
      h("div", { class: "head-acts" }, h("div", { class: "install-slot" }), themeBtn("btn ghost icon-btn", null))),
      h("section", { class: "page on" }, cur[3]())), bar));
  fillInstallSlots();
  if (active) { const el = document.getElementById(active); if (el && el.focus) { el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) { /* pas un champ texte */ } } }
  window.scrollTo(0, pos);
}

function enter() { refreshSignal(); refreshModels(); }
async function load() {
  S = await api("GET", "/api/state");
  resetDraft();
  render();
  enter();
}
addEventListener("hashchange", () => { const id = location.hash.slice(1); if (S && IDS.includes(id) && id !== page) { page = id; render(); window.scrollTo(0, 0); } });
api("GET", "/api/state").then(s => { S = s; resetDraft(); render(); enter(); }).catch(e => { if (e.message !== "login") showLogin(e.message); });
</script>
